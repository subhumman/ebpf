services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ebpf-backend
    
    ports:
      - "8000:8000"
    
    environment:
      # ЖЕСТКО задаем URL без aiosqlite
      - DATABASE_URL=sqlite:///./data/security_events.db
      - LOG_LEVEL=DEBUG
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - APP_VERSION=dev
    
    volumes:
      - .:/app
      - ./data:/app/data
    
    networks:
      - ebpf-network
    
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    restart: unless-stopped
    
    # Команда запуска с явным переопределением DATABASE_URL
    command: >
      bash -c "
        export DATABASE_URL=sqlite:///./data/security_events.db &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
      "

networks:
  ebpf-network:
    driver: bridge