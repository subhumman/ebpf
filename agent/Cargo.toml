[package]
name = "pet"
version = "0.1.0"
edition = "2021"

[dependencies]
aya = "0.12"
tokio = { version = "1", features = ["full", "rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"
reqwest = { version = "0.11", features = ["json"] }
anyhow = "1.0"

[build-dependencies]
cc = "1.0"

[[bin]]
name = "agent"
path = "src/main.rs"